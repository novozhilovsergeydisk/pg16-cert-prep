<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PostgreSQL 16 Cert Prep</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Симулятор сертификации PostgreSQL 16</h1>
        <div id="error" role="alert" hidden></div>

        <section id="categories-view">
            <div class="actions top-actions">
                <button id="open-exam" class="btn" type="button">Экзамен</button>
                <button id="open-mistakes" class="btn-secondary" type="button">Работа над ошибками</button>
                <button id="open-history" class="btn-secondary" type="button">История экзаменов</button>
            </div>
            <h2>Категории</h2>
            <ul id="categories" class="cards"></ul>
        </section>

        <section id="question-view" hidden>
            <button id="back" class="btn-secondary" type="button">К списку категорий</button>
            <h2 id="category-name"></h2>
            <p id="progress" class="progress"></p>
            <div id="question-text" class="question"></div>
            <p id="question-hint" class="hint" hidden></p>
            <form id="answer-form">
                <div id="options" class="options"></div>
                <button id="submit" class="btn" type="submit">Ответить</button>
            </form>
            <div id="result" class="result" hidden>
                <p id="result-status" class="status"></p>
                <p id="result-correct"></p>
                <p id="result-explanation" class="explanation"></p>
                <button id="next" class="btn" type="button">Далее</button>
            </div>
        </section>

        <section id="finish-view" hidden>
            <p>Вопросы в этой категории закончились.</p>
            <button id="finish-back" class="btn" type="button">К списку категорий</button>
        </section>

        <section id="exam-setup-view" hidden>
            <button id="exam-setup-back" class="btn-secondary" type="button">К списку категорий</button>
            <h2>Экзамен</h2>
            <fieldset>
                <legend>Число вопросов</legend>
                <div id="exam-count" class="chips"></div>
            </fieldset>
            <fieldset>
                <legend>Темы</legend>
                <div id="exam-categories" class="options"></div>
            </fieldset>
            <p id="exam-time-note" class="progress"></p>
            <button id="exam-start" class="btn" type="button">Начать экзамен</button>
        </section>

        <section id="exam-view" hidden>
            <div class="exam-bar">
                <span id="exam-progress" class="progress"></span>
                <span id="exam-timer" class="timer"></span>
            </div>
            <div id="exam-question" class="question"></div>
            <p id="exam-hint" class="hint" hidden></p>
            <div id="exam-options" class="options"></div>
            <div class="actions">
                <button id="exam-prev" class="btn-secondary" type="button">Назад</button>
                <button id="exam-next" class="btn" type="button">Далее</button>
                <button id="exam-finish" class="btn-secondary" type="button">Завершить экзамен</button>
            </div>
        </section>

        <section id="history-view" hidden>
            <button id="history-back" class="btn-secondary" type="button">К списку категорий</button>
            <h2>История экзаменов</h2>
            <p id="history-empty" class="progress" hidden>Пока нет пройденных экзаменов.</p>
            <ul id="history-list" class="plain"></ul>
        </section>

        <section id="exam-result-view" hidden>
            <h2>Результат экзамена</h2>
            <div class="result">
                <p id="score-percent" class="score"></p>
                <p id="score-status" class="status"></p>
                <p id="score-detail"></p>
            </div>
            <h2>По темам</h2>
            <ul id="score-categories" class="plain"></ul>
            <h2 id="errors-title">Ошибки</h2>
            <div id="score-errors"></div>
            <div class="actions">
                <button id="result-new" class="btn" type="button">Новый экзамен</button>
                <button id="result-back" class="btn-secondary" type="button">К списку категорий</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
